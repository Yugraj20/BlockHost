appId: com.voxelpulse.app
productName: VoxelPulse
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources/
    to: resources/
    filter:
      - '**/*'
win:
  executableName: VoxelPulse
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: VoxelPulse
  uninstallDisplayName: VoxelPulse Minecraft Server Manager
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: blockhost
  repo: blockhost-releases
